version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: scmc
      POSTGRES_PASSWORD: scmc_password
      POSTGRES_DB: scmc_database
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # WebUI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecret123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scmc_nextjs
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    depends_on:
      - postgres
      - minio

volumes:
  postgres-data:
  minio-data:
